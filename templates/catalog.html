{% extends "base.html" %}

{% block content %}

    <h3>CATÁLOGO</h3>
    <p> {{ number_articles }} artículos </p>

    <a href="{{ url_for('new_article') }}">Nuevo artículo</a>

    <ul>
        {% for article in articles %}
            <li class="article-row">
                <span class="article-info">
                    <span class="article-name">{{ article['name'] }}</span>
                    <span class="article-scope">{{ SCOPE_ES[article['scope']] }}</span>
                </span>

                <span class="article-price">{{ money(article['price']) }}</span>
                
                <span class="article-actions">
                    <a href="{{ url_for('delete_article', name=article['name']) }}">
                        <span class="material-symbols-outlined">delete</span>
                    </a>
                    <a href="{{ url_for('edit_article', name=article['name']) }}">
                        <span class="material-symbols-outlined">edit</span>
                    </a>
                </span>
            </li>

        {% endfor %}
    </ul>

{% endblock %}
