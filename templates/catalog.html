{% extends "base.html" %}
{% block content %}
    <div class="page-title">
        <h2>CATÁLOGO</h2>
        <p> {{ number_articles }} artículos </p>
    </div>
    <a class="article-new" href="{{ url_for('new_article') }}">Nuevo artículo</a>
    <ul>
        {% for article in articles %}
            <li class="article-row">
                <a class="article-edit" href="{{ url_for('edit_article', name=article['name']) }}">
                    <div class="article-info">
                        <div class="article-name"> {{ article['name'] }} </div>
                        <div class="article-scope"> {{ SCOPE_ES[article['scope']] }} </div>
                    </div>
                    <div class="article-price"> {{ money(article['price']) }} </div>
                </a>
                <a class="article-delete" href="{{ url_for('delete_article', name=article['name']) }}">Borrar</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
