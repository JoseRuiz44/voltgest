{% extends "base.html" %}

{% block content %}
    <a href="{{ url_for('new_article') }}">Nuevo artículo</a>
    <h2>Artículos</h2>
    <ul>
        {% for article in articles %}
            <li>
                {{ article['name'] }} - {{ article['scope'] }} - {{ article['price'] }}
                <a href="{{ url_for('delete_article', name=article['name']) }}">Borrar</a>
                <a href="{{ url_for('edit_article', name=article['name']) }}">Editar</a>
            </li>
        {% endfor %}
    </ul>

{% endblock %}
