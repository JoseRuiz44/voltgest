{% extends "base.html" %}
{% block content %}
    <div class="page">
        <div class="page-title">
            <h2>Presupuesto {{ number }}</h2>
        </div>
        <div class="share-actions">
            <div class="share-row">
                <a class="button button-primary" href="{{ url_for('budget_pdf', number=number, version='client') }}" target="_blank" rel="noopener">
                    PDF cliente
                </a>
                <button type="button" class="button button-outline button-icon"
                    aria-label="Compartir"
                    data-share-url="{{ url_for('budget_pdf', number=number, version='client') }}"
                    data-share-name="{{ number }}.pdf"
                    hidden><span class="material-icons">share</span></button>
            </div>

            <div class="share-row">
                <a class="button button-primary" href="{{ url_for('budget_pdf', number=number, version='business') }}" target="_blank" rel="noopener">
                    PDF empresa
                </a>
                <button type="button" class="button button-outline button-icon"
                    aria-label="Compartir"
                    data-share-url="{{ url_for('budget_pdf', number=number, version='business') }}"
                    data-share-name="{{ number }}-interno.pdf"
                    hidden><span class="material-icons">share</span></button>
            </div>
        </div>
    </div>
{% endblock %}
{% block scripts %}
    <script src="{{ url_for('static', filename='share.js') }}" defer></script>
{% endblock %}
