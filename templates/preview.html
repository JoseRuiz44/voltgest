{% extends "base.html" %}
{% block content %}
    <div class="page">
        <div class="page-title">
            <h2>Presupuesto {{ number }}</h2>
        </div>
        <button class="button button-primary" onclick="mostrarPDF('client')">PDF Cliente</button>
        <button class="button button-primary" onclick="mostrarPDF('business')">PDF Empresa</button>
        <iframe id="visor_pdf" 
                src="{{ url_for('budget_pdf', number=number, version='client') }}" 
                width="100%" height="800px"></iframe>
    </div>
    <script>
        function mostrarPDF(version) {
            const visor = document.getElementById("visor_pdf");
            visor.src = "/budget/pdf/{{ number }}/" + version;
        }
    </script>
{% endblock %}
