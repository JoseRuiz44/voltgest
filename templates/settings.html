{% extends "base.html" %}

{% block content %}
    <h2>Ajustes</h2>
    <form method="POST" action="{{ url_for('settings') }}">
        <h3>DATOS DEL NEGOCIO</h3>
        <label>Empresa o titular:</label>
        <input type="text" name="name" value="{{ config['business']['name'] }}">

        <label>Apellidos:</label>
        <input type="text" name="last_name" value="{{ config['business']['last_name'] }}">

        <label>NIF / CIF:</label>
        <input type="text" name="tax_id" value="{{ config['business']['tax_id'] }}">
        
        <label>Dirección:</label>
        <input type="text" name="address" value="{{ config['business']['address'] }}">

        <label>Teléfono:</label>
        <input type="text" name="phone" value="{{ config['business']['phone'] }}">

        <label>Email:</label>
        <input type="text" name="email" value="{{ config['business']['email'] }}">

        <h3>PRESUPUESTO</h3>
        <label>Condiciones:</label>
        <input type="text" name="conditions" value="{{ config['conditions'] }}">

        <label>Validez:</label>
        <input type="text" name="validity_days" value="{{ config['validity_days'] }}">

        <button type="submit">Guardar cambios</button>
    </form>
{% endblock %}
