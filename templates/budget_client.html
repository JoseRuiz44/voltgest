{% extends "base.html" %}
{% block content %}
    <div class="page">
        <div class="page-title">
            <div class="back-title">
                <button type="button" class="button-reset icon-cancel material-icons"
                    aria-label="Descartar presupuesto"
                    data-confirm-url="{{ url_for('cancel_budget') }}"
                    data-confirm-text="¿Descartar este presupuesto?"
                    data-confirm-action="Descartar">arrow_back</button>
                <h2>Datos del cliente</h2>
            </div>
            <div>
                <button type="button" class="button-reset icon-cancel material-icons"
                    aria-label="Descartar presupuesto"
                    data-confirm-url="{{ url_for('cancel_budget') }}"
                    data-confirm-text="¿Descartar este presupuesto?"
                    data-confirm-action="Descartar">close</button>
            </div>
        </div>
        <form class="form" method="POST" action="{{ url_for('save_client') }}">
            <label class="name" for="name-field">Nombre:
                <input id="name-field" type="text" name="name" value="{{ session['budget']['client']['name'] }}">
            </label>
            <label class="address" for="address-field">Dirección:
                <input id="address-field" type="text" name="address" value="{{ session['budget']['client']['address'] }}">
            </label>
            <label class="phone" for="phone-field">Teléfono:
                <input id="phone-field" type="tel" name="phone" value="{{ session['budget']['client']['phone'] }}">
            </label>
            <button class="button button-primary" type="submit">Guardar cliente</button>
        </form>
    </div>
{% endblock %}
