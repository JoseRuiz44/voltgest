<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <title>VoltGest</title>
    </head>

    <body>
        <header class="topbar">
                <h1>VoltGest</h1>
        </header>

        <div class="layout">
            <nav class="sidebar">
                <a href="{{ url_for('home') }}" {% if session['budget'] %}onclick="return confirm('Al salir se perderán los datos del presupuesto, ¿continuar?')"{% endif %}>Inicio</a>
                <a href="{{ url_for('catalog') }}" {% if session['budget'] %}onclick="return confirm('Al salir se perderán los datos del presupuesto, ¿continuar?')"{% endif %}>Catálogo</a>
                <a href="{{ url_for('record') }}" {% if session['budget'] %}onclick="return confirm('Al salir se perderán los datos del presupuesto, ¿continuar?')"{% endif %}>Historial</a>
                <a href="{{ url_for('settings') }}" {% if session['budget'] %}onclick="return confirm('Al salir se perderán los datos del presupuesto, ¿continuar?')"{% endif %}>Ajustes</a>
            </nav>

            <main class="main">
                {% for message in get_flashed_messages() %}
                    <p class="flash">{{ message }}</p>
                {% endfor %}

                {% block content %}{% endblock %}
            </main>
        </div>
    </body>
</html>
