<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <title>VoltGest</title>
    </head>
    <body>
        <main class="{% if not session['budget'] %}has-nav{% endif %}">
            {% for message in get_flashed_messages() %}
                <p>{{ message }}</p>
            {% endfor %}
            {% block content %}{% endblock %}
        </main>
        {% if not session['budget'] %}
            <nav class="main-nav">
                <a class="a-reset a-nav {% if request.endpoint == 'home' %}a-nav-active{% endif %}" href="{{ url_for('home') }}"><span class="icon-nav material-icons">home</span><span class="nav-text">Inicio</span></a>
                <a class="a-reset a-nav {% if request.endpoint == 'catalog' %}a-nav-active{% endif %}" href="{{ url_for('catalog') }}"><span class="icon-nav material-icons">view_list</span> <span class="nav-text">Catálogo</span></a>
                <a class="a-reset a-nav {% if request.endpoint == 'record' %}a-nav-active{% endif %}" href="{{ url_for('record') }}"><span class="icon-nav material-icons">work_history</span> <span class="nav-text">Historial</span></a>
                <a class="a-reset a-nav {% if request.endpoint == 'settings' %}a-nav-active{% endif %}" href="{{ url_for('settings') }}"><span class="icon-nav material-icons">settings</span> <span class="nav-text">Ajustes</span></a>
            </nav>
        {% endif %}
        <dialog class="confirm-dialog">
            <p class="confirm-question"></p>
            <p class="confirm-note">Esta acción no se puede deshacer.</p>
            <form class="confirm-actions" method="POST">
                <button type="submit" class="button button-outline" formmethod="dialog" autofocus>Cancelar</button>
                <button type="submit" class="button button-danger confirm-accept"></button>
            </form>
        </dialog>
        <script src="{{ url_for('static', filename='confirm.js') }}" defer></script>
        {% block scripts %}{% endblock %}
    </body>
</html>
